# Render Deploy button Blueprint (T-0387), kept on docs/render-button-blueprint.
# Community installs build source from main but require manual deploys. Keep this isolated from the hosted-demo
# root render.yaml, which deploys after CI checks pass. Every secret is sync: false and must be entered by the owner.
# This provisions three paid services and does not provision Postgres, R2, Vercel, GitHub or PayPal accounts.
services:
  - type: web
    name: stood-demo-api
    repo: https://github.com/ma-za-kpe/stood
    runtime: docker
    region: frankfurt
    # Starter, always on (owner's choice, 2026-10-12): on the free plan it slept when idle and took up to 11 minutes to
    # wake, so signed requests held that long outlived their 5-minute signature and were refused.
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    branch: main
    # Community button installs link to main but deploy only when the owner asks.
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: "3000"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: STOOD_PLATFORM_ID
        value: stood-demo
      - key: PROVIDER_PAYPAL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: STOOD_API_KEY
        sync: false
      - key: STOOD_HMAC_SECRET
        sync: false
      - key: STOOD_WEBHOOK_SECRET
        sync: false
      # C4 (#77): public Ed25519 keys whose usage receipts Stood accepts (Yard's usage key). Public, but set per deploy.
      - key: USAGE_AUTHORITY_KEYS
        sync: false
      # T-0227/T-0260: keys that seal saved PayPal tokens; signing and funding stay off without them.
      - key: VAULT_TOKEN_KEYS
        sync: false
      # T-0156: the API issues bounded upload URLs and checks site-visit bytes in Stood's private bucket.
      - key: STOOD_EVIDENCE_S3_ENDPOINT
        sync: false
      - key: STOOD_EVIDENCE_S3_BUCKET  # gitleaks:allow (a variable name, no value)
        value: stood-evidence
      - key: STOOD_EVIDENCE_S3_ACCESS_KEY_ID
        sync: false
      - key: STOOD_EVIDENCE_S3_SECRET_ACCESS_KEY
        sync: false
  - type: worker
    name: stood-demo-reconciler
    repo: https://github.com/ma-za-kpe/stood
    runtime: docker
    region: frankfurt
    # Render has no free plan for background workers. Owner chose Starter (2026-10-07).
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /nodejs/bin/node dist/reconcile-cli.js
    # T-0253: apply migrations before this release goes live (paid instances only); a failure stops the deploy.
    preDeployCommand: /nodejs/bin/node dist/migrate-cli.js
    branch: main
    # Community button installs link to main but deploy only when the owner asks.
    autoDeployTrigger: 'off'
    envVars:
      - key: APP_ENV
        value: demo
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PROVIDER_PAYPAL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: RECONCILIATION_OWNER
        sync: false
      # T-0227/T-0260: keys that seal saved PayPal tokens; signing and funding stay off without them.
      - key: VAULT_TOKEN_KEYS
        sync: false
      # T-0159 (ADR-0026): the code runner on Vercel Sandbox and its own signing key; off without them.
      - key: VERCEL_TOKEN
        sync: false
      - key: VERCEL_TEAM_ID
        value: team_fwytuyzy5ee2wV6qo9Yy2oAh
      - key: VERCEL_PROJECT_ID
        value: prj_rWTnqhAZJ7fHXYDLexg4VtrGknlG
      - key: RUNNER_KEY_ID
        sync: false
      - key: RUNNER_SIGNING_KEY
        sync: false
      # C4 (#77): Stood's evidence bucket (Cloudflare R2, bucket-scoped token). The runner stays off without it.
      - key: STOOD_EVIDENCE_S3_ENDPOINT
        sync: false
      - key: STOOD_EVIDENCE_S3_BUCKET  # gitleaks:allow (a variable name, no value)
        value: stood-evidence
      - key: STOOD_EVIDENCE_S3_ACCESS_KEY_ID
        sync: false
      - key: STOOD_EVIDENCE_S3_SECRET_ACCESS_KEY
        sync: false
      # T-0359: only expired OPEN sessions; deliberately off until the owner authorizes incomplete-object cleanup.
      - key: INCOMPLETE_UPLOAD_CLEANUP
        value: "off"
      # GitHub reads (#77): the Yard GitHub App's short-lived, read-only installation tokens. The App's private key is
      # prompted (the same one stood-yard-api uses). GITHUB_READ_TOKEN is the fallback while the key is not set.
      - key: GITHUB_APP_ID
        value: "5230872"
      - key: GITHUB_APP_INSTALLATION_ID
        value: "169056228"
      - key: GITHUB_APP_PRIVATE_KEY_BASE64
        sync: false
      - key: GITHUB_READ_TOKEN
        sync: false
      # The owner's switch: captures or voids decided tranches only when set to "on".
      - key: SETTLEMENT_EXECUTOR
        sync: false
  - type: web
    name: stood-demo-yard-api
    repo: https://github.com/ma-za-kpe/stood
    runtime: docker
    region: frankfurt
    # Always on for lease expiry and log retention jobs; Starter chosen by the owner (2026-10-08).
    plan: starter
    dockerfilePath: ./services/yard-api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # T-0214: Yard's schema, as its owner role, before each release goes live.
    preDeployCommand: /nodejs/bin/node dist/db-cli.js migrate
    branch: main
    # Community button installs link to main but deploy only when the owner asks.
    autoDeployTrigger: 'off'
    envVars:
      - key: YARD_ENV
        value: demo
      - key: PORT
        value: "3001"
      - key: YARD_DATABASE_URL
        sync: false
      - key: YARD_MIGRATION_DATABASE_URL
        sync: false
      - key: YARD_OPERATORS
        sync: false
      - key: YARD_SECRET_KEYS
        sync: false
      # T-0181: the hosted Foreman. Only the xAI key and the App's private key are secrets; the rest is public.
      - key: GROK_PLANNER_API_KEY
        sync: false
      - key: GROK_PLANNER_MODEL
        value: grok-build-0.1
      - key: GROK_DAILY_BUDGET_USD
        value: "0.50"
      - key: GITHUB_APP_ID
        value: "5230872"
      - key: GITHUB_APP_PRIVATE_KEY_BASE64
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        value: "169056228"
      - key: YARD_SANDBOX_REPOSITORY
        value: ma-za-kpe/yard-sandbox
      # T-0189: Yard reaches Stood with the platform's signed API credentials (the same pair stood-api holds).
      - key: STOOD_API_URL
        value: https://stood-api.onrender.com
      - key: STOOD_API_KEY
        sync: false
      - key: STOOD_HMAC_SECRET
        sync: false
      # ADR-0027: Yard's PayPal merchant id, the payee of every allowance (builders are paid out after release).
      - key: YARD_PAYPAL_MERCHANT_ID
        sync: false
      # ADR-0027: Yard's fee on top of each milestone, in basis points (500 is 5%), paid by the buyer in the same hold.
      - key: YARD_FEE_BPS
        value: "500"
      # ADR-0027: Yard's own PayPal sandbox REST app (never Stood's), used only to pay builders out (PayPal Payouts).
      - key: YARD_PAYPAL_CLIENT_ID
        sync: false
      - key: YARD_PAYPAL_CLIENT_SECRET
        sync: false
      # C4 (#77): Yard's Ed25519 usage key; Stood lists its public half in USAGE_AUTHORITY_KEYS.
      - key: YARD_USAGE_KEY_ID
        sync: false
      - key: YARD_USAGE_SIGNING_KEY
        sync: false
      # T-0196: previews in a separate Render workspace, so this key cannot reach Stood's services.
      - key: RENDER_PREVIEW_API_KEY
        sync: false
      - key: RENDER_PREVIEW_OWNER_ID
        sync: false
