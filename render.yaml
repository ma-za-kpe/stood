# Render Blueprint for the hosted demo (T-0214). Sandbox only: no live PayPal host, no committed secrets.
# Every secret is sync: false, so Render asks the owner for it in their own account. Render deploys main
# automatically once its GitHub checks pass (no Actions minutes); the reconciler's pre-deploy step applies
# migrations first. Yard runs as one Starter web service (owner's choice, 2026-10-08) with its own restricted
# database role; its pre-deploy step applies Yard's schema.
services:
  - type: web
    name: stood-api
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    branch: main
    # Deploy when a main commit's GitHub checks pass (Render watches GitHub: no Actions minutes).
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: demo
      - key: DEMO_MODE
        value: "true"
      - key: PORT
        value: "3000"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: STOOD_PLATFORM_ID
        value: stood-demo
      - key: PROVIDER_PAYPAL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: STOOD_API_KEY
        sync: false
      - key: STOOD_HMAC_SECRET
        sync: false
      - key: STOOD_WEBHOOK_SECRET
        sync: false
      # T-0227/T-0260: keys that seal saved PayPal tokens; signing and funding stay off without them.
      - key: VAULT_TOKEN_KEYS
        sync: false
  - type: worker
    name: stood-reconciler
    runtime: docker
    region: frankfurt
    # Render has no free plan for background workers. Owner chose Starter (2026-10-07).
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: /nodejs/bin/node dist/reconcile-cli.js
    # T-0253: apply migrations before this release goes live (paid instances only); a failure stops the deploy.
    preDeployCommand: /nodejs/bin/node dist/migrate-cli.js
    branch: main
    # Deploy when a main commit's GitHub checks pass (Render watches GitHub: no Actions minutes).
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: demo
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: PROVIDER_PAYPAL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: RECONCILIATION_OWNER
        sync: false
      # T-0227/T-0260: keys that seal saved PayPal tokens; signing and funding stay off without them.
      - key: VAULT_TOKEN_KEYS
        sync: false
  - type: web
    name: stood-yard-api
    runtime: docker
    region: frankfurt
    # Always on for lease expiry and log retention jobs; Starter chosen by the owner (2026-10-08).
    plan: starter
    dockerfilePath: ./services/yard-api/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    # T-0214: Yard's schema, as its owner role, before each release goes live.
    preDeployCommand: /nodejs/bin/node dist/db-cli.js migrate
    branch: main
    autoDeployTrigger: checksPass
    envVars:
      - key: YARD_ENV
        value: demo
      - key: PORT
        value: "3001"
      - key: YARD_DATABASE_URL
        sync: false
      - key: YARD_MIGRATION_DATABASE_URL
        sync: false
      - key: YARD_OPERATORS
        sync: false
      - key: YARD_SECRET_KEYS
        sync: false
      # T-0181: the hosted Foreman. Only the xAI key and the App's private key are secrets; the rest is public.
      - key: GROK_PLANNER_API_KEY
        sync: false
      - key: GROK_PLANNER_MODEL
        value: grok-build-0.1
      - key: GROK_DAILY_BUDGET_USD
        value: "0.50"
      - key: GITHUB_APP_ID
        value: "5230872"
      - key: GITHUB_APP_PRIVATE_KEY_BASE64
        sync: false
      - key: GITHUB_APP_INSTALLATION_ID
        value: "169056228"
      - key: YARD_SANDBOX_REPOSITORY
        value: ma-za-kpe/yard-sandbox
      # T-0189: Yard reaches Stood with the platform's signed API credentials (the same pair stood-api holds).
      - key: STOOD_API_URL
        value: https://stood-api.onrender.com
      - key: STOOD_API_KEY
        sync: false
      - key: STOOD_HMAC_SECRET
        sync: false
      # T-0196: previews in a separate Render workspace, so this key cannot reach Stood's services.
      - key: RENDER_PREVIEW_API_KEY
        sync: false
      - key: RENDER_PREVIEW_OWNER_ID
        sync: false
