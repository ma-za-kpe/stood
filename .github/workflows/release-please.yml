name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # googleapis/release-please-action v5.0.0, pinned to full SHA (docs/WAYS_OF_WORKING.md §11)
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          target-branch: main   # develop is the default branch; releases come from main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
