name: ci

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check simulated Yard page on desktop and mobile
        run: |
          LOCAL_UID="$(id -u)"
          LOCAL_GID="$(id -g)"
          export LOCAL_UID LOCAL_GID
          scripts/check-site
  mock-network:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run isolated services and shared network scenarios
        run: |
          LOCAL_UID="$(id -u)"
          LOCAL_GID="$(id -g)"
          export LOCAL_UID LOCAL_GID
          scripts/dev mock
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      # actions/setup-node v7.0.0 (markdownlint, biome)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      # actions/cache v6.1.0
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
      # Hash-locked (Scorecard Pinned-Dependencies); Dependabot keeps .github/requirements current.
      - run: pip install --require-hashes -r .github/requirements/pre-commit.txt
      - name: Prepare the Docker toolchain
        run: |
          LOCAL_UID="$(id -u)"
          LOCAL_GID="$(id -g)"
          export LOCAL_UID LOCAL_GID
          docker compose build app
          docker compose run --rm app pnpm install --frozen-lockfile
      - name: Run every hook on every file
        env:
          SKIP: no-commit-to-branch,branch-name
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Run the pre-push product gate (Docker validation and Postgres tests)
        env:
          SKIP: no-commit-to-branch,branch-name
        run: pre-commit run --all-files --hook-stage pre-push --show-diff-on-failure

  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      # amannn/action-semantic-pull-request v6.1.1
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            refactor
            perf
            chore
            ci
            build
            revert

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Every human commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          while IFS= read -r sha; do
            author=$(git log -1 --format='%an' "$sha")
            if [[ "$author" == *"[bot]" ]]; then continue; fi
            if ! git log -1 --format='%B' "$sha" | grep -qE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit $sha by $author has no Signed-off-by (use git commit -s)"
              missing=1
            fi
          done < <(git rev-list --no-merges "$BASE..$HEAD")
          exit "$missing"
