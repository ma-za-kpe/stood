name: landing-page

# Publishes the landing page, changelog and API portal (/api/) to GitHub Pages on every merge to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      portal: ${{ steps.portal.outputs.portal }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Build site (version + rendered CHANGELOG.md)
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @stood/yard-domain build
          pnpm --filter @stood/yard-contracts build
          pnpm --filter @stood/yard-web build
          npm ci --prefix tools/site --ignore-scripts
          node tools/site/build.mjs
      # T-0332: the APIMatic developer portal for the Stood API, from openapi/stood.json, at /stood/api/.
      # Without the APIMATIC_API_KEY secret the site publishes without it. When APIMatic's service
      # itself fails three times, nothing is published, so the live site keeps its last good portal.
      # A portal that generates but fails check-portal still fails the job.
      - name: Build API portal (APIMatic)
        id: portal
        env:
          APIMATIC_API_KEY: ${{ secrets.APIMATIC_API_KEY }}
        run: |
          if [ -z "$APIMATIC_API_KEY" ]; then echo "APIMATIC_API_KEY not set: publishing without the API portal."; echo "portal=skipped" >> "$GITHUB_OUTPUT"; exit 0; fi
          cp openapi/stood.json apimatic/src/spec/stood.json
          for attempt in 1 2 3; do
            if npx -y @apimatic/cli@1.5.0 portal generate --input=apimatic --destination=_site/api --force --auth-key="$APIMATIC_API_KEY"; then
              test -f _site/api/index.html
              node tools/site/check-portal.mjs _site/api
              echo "portal=built" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "APIMatic portal generation failed (attempt $attempt of 3)."
            sleep $((attempt * 20))
          done
          echo "::warning title=API portal not regenerated::APIMatic portal generation failed three times; the live site is left unchanged."
          echo "portal=unavailable" >> "$GITHUB_OUTPUT"
      # actions/configure-pages v6.0.0
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      # actions/upload-pages-artifact v5.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.portal != 'unavailable'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages v5.0.1
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
