name: Feature or use case
description: Propose a capability or a new evidence profile
labels: [enhancement]
body:
  - type: checkboxes
    id: duplicates
    attributes:
      label: Duplicate check
      description: Search both open and closed issues before filing.
      options:
        - label: I checked open and closed issues and this is not a duplicate.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Who is the payer, who is the payee, and what does "done" mean?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: What evidence proves it? Which generic checks (S16) would it use?
  - type: textarea
    id: notes
    attributes:
      label: Anything else
