# gitleaks: the default rules, plus files generated by APIMatic from openapi/stood.json (T-0053). Their examples
# ("const idempotencyKey = 'Idempotency-Key0'") match the generic API-key rule but hold no secret. The spec itself,
# the hand-written signer and everything else stay fully scanned; ggshield scans every commit before push.
[extend]
useDefault = true

[[allowlists]]
description = "APIMatic-generated SDK documentation and change-tracking state"
paths = ['''^sdk/typescript/doc/''', '''^apimatic/src/sdk-source-tree/''']
