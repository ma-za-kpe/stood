[default]
# STRIDE-style bold initials: **I**nformation, **R**epudiation
extend-ignore-re = ["\\*\\*[A-Z]\\*\\*[a-z]+"]

[files]
extend-exclude = ["docs/brand/**/*.svg", "*.lock", "CHANGELOG.md"]
