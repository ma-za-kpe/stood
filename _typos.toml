[default.extend-words]
# Names and domain words that are correct
Kojo = "Kojo"
Esi = "Esi"
Ama = "Ama"
cedi = "cedi"
cedis = "cedis"
Paga = "Paga"
Xoom = "Xoom"
Koscot = "Koscot"
ser = "ser"
Magentic = "Magentic"
RTO = "RTO"
