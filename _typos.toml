[default.extend-words]
# Names and domain words that are correct
Kojo = "Kojo"
Esi = "Esi"
Ama = "Ama"
cedi = "cedi"
cedis = "cedis"
Paga = "Paga"
Xoom = "Xoom"
Koscot = "Koscot"
ser = "ser"
Magentic = "Magentic"
RTO = "RTO"
wdth = "wdth"
opsz = "opsz"
# setpriv --inh-caps (inheritable capabilities)
inh = "inh"

[default]
# STRIDE-style bold initials: **I**nformation, **R**epudiation
extend-ignore-re = ["\\*\\*[A-Z]\\*\\*[a-z]+", "(?:pkg_|trn_|alw_|bl_|upl_)[a-f0-9]{8}(?:-[a-f0-9]{4}){3}-[a-f0-9]{12}"]

[files]
extend-exclude = ["docs/brand/**/*.svg", "*.lock", "CHANGELOG.md", "packages/yard-contracts/test/fakes/startup-tribunal.json"]

# The excluded #99 report is upstream data: preserve source keys (som_usd) and brands (Canva).
