# Local quality gate. See docs/WAYS_OF_WORKING.md §8. Never use --no-verify.
# Install: pre-commit install --hook-type pre-commit --hook-type commit-msg
minimum_pre_commit_version: "3.2.0"
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-json
      - id: check-xml
        name: check svg is valid xml
        files: \.svg$
        types: [file]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/lycheeverse/lychee
    rev: lychee-v0.24.2
    hooks:
      - id: lychee
        name: markdown links (offline, local files only)
        args: [--no-progress, --offline, --include-fragments]
        files: \.md$

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, test, refactor, perf, chore, ci, build, revert]

  # --- Pre-registered for when code lands (docs/WAYS_OF_WORKING.md §8) ---
  # formatter check, linter, strict type check, affected unit tests,
  # money-boundary import check, banned-words copy check, dependency audit.
