# Cutthroat local gate. CI runs this same file on every PR. Never use --no-verify.
# See docs/WAYS_OF_WORKING.md §8.   Install: pre-commit install
minimum_pre_commit_version: "4.0.0"
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false

repos:
  # ---------- git + file hygiene ----------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: forbid-submodules
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: fix-byte-order-marker
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-xml
        name: check svg is valid xml
        files: \.svg$
        types: [file]
      - id: detect-private-key
      - id: detect-aws-credentials
        args: [--allow-missing-credentials]

  - repo: local
    hooks:
      - id: branch-name
        name: branch name follows GitFlow (docs/WAYS_OF_WORKING.md §7)
        language: system
        pass_filenames: false
        always_run: true
        entry: >-
          bash -c 'b=$(git rev-parse --abbrev-ref HEAD);
          [[ "$b" == "HEAD" || "$b" =~ ^(feature|fix|hotfix|release|docs|chore|ci|build|refactor|test|perf|revert|spike)/[a-z0-9][a-z0-9._-]*$ ]]
          || { echo "Branch \"$b\" must be <type>/<slug>, e.g. feature/42-hold-timers"; exit 1; }'
      - id: banned-words
        name: banned words in user-facing copy (S06 voice)
        language: pygrep
        entry: '(?i)\b(escrow|verified|fraud)\b|something went wrong'
        files: ^(site|apps)/
      - id: dco-signoff
        name: DCO Signed-off-by present
        language: pygrep
        entry: '^Signed-off-by: .+ <.+@.+>$'
        args: [--negate]
        stages: [commit-msg]

  # ---------- secrets ----------
  - repo: local
    hooks:
      # Knows your actual values (from .env and the GitHub App key) instead of guessing patterns (T-0252).
      - id: no-local-secrets
        name: no local secret values in staged files
        language: system
        entry: tools/no-local-secrets/check.py
        types: [text]
      - id: no-local-secrets-tests
        name: no-local-secrets hook tests
        language: system
        entry: python3 -m unittest discover tools/no-local-secrets
        pass_filenames: false
        files: ^tools/no-local-secrets/
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # ---------- GitHub Actions ----------
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: fa412071e4f5d44d44f9e365f4676f9df92456a2  # frozen: v1.30.1
    hooks:
      - id: zizmor
        args: [--min-severity=low]
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0494aa7fa1314e98913a41227d8f0a515b2c1049  # frozen: 0.38.2
    hooks:
      - id: check-github-workflows
      - id: check-dependabot

  # ---------- docs ----------
  # Node hooks run via pinned npx (npm 11 blocks pre-commit's git-based node installs)
  - repo: local
    hooks:
      # Pinned images instead of host npx or node hooks: hermetic, and Docker is already required.
      - id: markdownlint-cli2
        name: markdownlint-cli2 (auto-fix)
        language: docker_image
        entry: mirror.gcr.io/davidanson/markdownlint-cli2@sha256:d5f3f3f04b2e285dcbcdcd13b4454d119e273e3c393a9dabd163dba4abad526d --fix  # v0.23.3
        types: [markdown]
        require_serial: true   # --fix rewrites files; parallel containers would race
  - repo: https://github.com/crate-ci/typos
    rev: b859c0df7f391deba73030f79b957e62b4d81dc6  # frozen: varcon-core-v5.0.7
    hooks:
      - id: typos
        args: [--force-exclude]   # report only: never auto-rewrite names like Magentic
  - repo: local
    hooks:
      - id: lychee
        name: markdown links (offline, local files + anchors)
        language: system
        entry: scripts/check-links
        require_serial: true
        files: \.md$

  # ---------- web code ----------
  - repo: local
    hooks:
      - id: hadolint
        name: Dockerfile lint (pinned container)
        language: system
        entry: scripts/check-docker
        pass_filenames: false
        files: (^Dockerfile$|^tools/site/Dockerfile\.test$|^scripts/check-docker$)
      - id: hooks-installed
        name: pre-commit, commit-msg and pre-push hooks are installed (T-0286)
        language: system
        entry: scripts/check-hooks-installed
        pass_filenames: false
        always_run: true
      - id: ci-local
        name: every CI job, locally, before anything is pushed (T-0286; about 25 minutes)
        language: system
        entry: scripts/ci-local
        pass_filenames: false
        always_run: true
        stages: [pre-push]   # includes scripts/check-product; CI skips this hook and runs the jobs itself (ADR-0023)

  # ---------- commit message ----------
  - repo: local
    hooks:
      - id: biome-check
        name: biome check (format + lint, auto-fix)
        language: docker_image
        entry: ghcr.io/biomejs/biome@sha256:e73b0563691da8c60ebfdb1553adea0c5d531752460e1672c1020d2d83a7e5d7 check --write --files-ignore-unknown=true --no-errors-on-unmatched  # v2.5.15
        files: \.(js|mjs|cjs|ts|tsx|css|json|jsonc)$
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck
        name: shellcheck (shell scripts)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f12be1ebaa5351c1fc76472de98db2c3446c8253  # frozen: v0.16.10
    hooks:
      - id: ruff-check
        name: ruff check (Python tools)
        args: [--fix]
      - id: ruff-format
        name: ruff format (Python tools)
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 91ab4bf57e58b32adf1a122681f6ebe164d081c8  # frozen: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict, feat, fix, docs, test, refactor, perf, chore, ci, build, revert]

  # --- Pre-registered for when product code lands (docs/WAYS_OF_WORKING.md §8) ---
  # tsc --strict, dependency-cruiser money boundary, affected vitest suites,
  # coverage floors, pnpm audit, OpenAPI breaking-change diff.
